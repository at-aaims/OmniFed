# ================================================================================
# Caltech-256 + log-normal quantity skew (LEAF-style; FedLab unbalance_sgm)
#
# Client sizes proportional to exp(N(0, sigma^2)): sigma 0 = equal sizes, larger
# sigma = heavier tail of large clients. Redrawn until every client has at least
# min_samples_per_client.
#
# Labels stay IID: each client's label mix matches the global one; only the
# amount of data differs. Sizes sum to the full train set (all data is used).
# Eval stays the shared test set. Data, loaders, and what is returned:
# cal256-common.yaml
#
# Usage: python main.py datamodule=skewed-data-sim/cal256-lognormal-quantity-skew datamodule.partitioner.sigma=2.0
# Test:  src/omnifed/data/skewed/test_quantity_skew/test_lognormal_quantity_skew.py
# ================================================================================

defaults:
  - /datamodule/skewed-data-sim/cal256-common@_here_ # absolute path, merged into this package
  - _self_

partitioner:
  _target_: src.omnifed.data.skewed.quantity_skew.LogNormalQuantitySkew
  sigma: 1.0
  max_retries: 1000
  min_samples_per_client: 10 # smallest allowed client
  stateful_loader: true # torchdata StatefulDataLoader (false = torch DataLoader)
  # seed: 0             # optional; default $OMNIFED_PARTITION_SEED, else 0
