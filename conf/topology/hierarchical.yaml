# ================================================================================
# Hierarchical topology (Slurm two-hop)
#
# Inner: TorchDist per facility. Outer: Flora-style gRPC to a dedicated RPC rank.
# Engine / SLURM_NTASKS see a flat world: 1 server + num_facilities × ranks.
# ================================================================================

defaults:
  - base
  - _self_

_target_: src.omnifed.topology.HierarchicalTopology

num_facilities: 2
mpi_ranks_per_facility: 3
dedicated_rpc_server: true
rpc_addr: "127.0.0.1"
rpc_port: 50051
facility_mpi_addr: "127.0.0.1"
facility_mpi_base_port: 28250
facility_mpi_port_stride: 40
facility_name_prefix: "fac"
communicators:
  intra_facility: torch_mpi
  global_aggregation: grpc

has_server: true
# Trainers = num_facilities × mpi_ranks_per_facility. Required in frozen yaml
# because the worker reads cfg.topology.num_clients, not the Python object.
num_clients: 6

local_comm: ???
