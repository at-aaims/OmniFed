# ================================================================================
# FedSGD Algorithm Configuration
#
# Same class/loop as FedAvg. Payload is gradients; sync after every batch.
# Scientists select this with:  algorithm: fedsgd
# ================================================================================

defaults:
  - base
  - override schedules/aggregation: batch_end
  - _self_

# NOTE: Check constructor signature for complete parameter list, defaults, types, and docs.
_target_: src.omnifed.algorithm.FedSGD

# Average grads (then step). Frequency is schedules.aggregation.batch_end.every only.
aggregate_payload: gradients
