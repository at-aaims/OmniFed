# @package _global_
# Same recipe as fedavg_grpc with TorchDist all-reduce (no dummy rank).
# slurm.nodes must equal topology.num_clients (every rank trains).

defaults:
  - /base
  - /communicator@topology.local_comm: torchdist
  - /communicator/compression@topology.local_comm.compressor: dense
  - /payload: params
  - override /topology: decentralized
  - override /algorithm: fedavg
  - override /algorithm/schedules/aggregation: batch_end
  - override /model: resnet18
  - override /datamodule: cifar10
  - _self_

engine:
  mode: slurm

topology:
  num_clients: 6

algorithm:
  local_lr: 0.001
  max_epochs_per_round: 1
  schedules:
    evaluation:
      experiment_start:
        enabled: true
      experiment_end:
        enabled: true
      pre_aggregation:
        enabled: false
      post_aggregation:
        enabled: false

model:
  num_classes: 10

datamodule:
  train:
    batch_size: 128
  eval:
    batch_size: 128

global_rounds: 4

slurm:
  enabled: true
  nodes: 6
  ntasks_per_node: 1
