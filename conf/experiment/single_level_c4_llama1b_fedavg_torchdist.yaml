# @package _global_
# Llama-1B C4 | FedAvg params | TorchDist dense | 6 trainers (6 nodes, allreduce).
# No gRPC protobuf cap — chunking does not apply.

defaults:
  - /base
  - /communicator@topology.local_comm: torchdist
  - /communicator/compression@topology.local_comm.compressor: dense
  - /payload: params
  - override /topology: decentralized
  - override /algorithm: fedavg
  - override /algorithm/schedules/aggregation: batch_end
  - override /algorithm/schedules/evaluation: disabled
  - override /model: llama1b_hf_disk
  - override /datamodule: c4_lm_federated_disk
  - _self_

engine:
  mode: slurm

topology:
  num_clients: 6

datamodule:
  num_federated_clients: 6
  max_train_batches: 8
  include_eval: false

algorithm:
  local_lr: 4.0e-4
  max_epochs_per_round: 1
  optimizer: adamw

global_rounds: 2

slurm:
  enabled: true
  nodes: 6
  ntasks_per_node: 1
  exclusive: true
  time: "02:00:00"
  job_name: llama1b_fedavg_torchdist_dense
