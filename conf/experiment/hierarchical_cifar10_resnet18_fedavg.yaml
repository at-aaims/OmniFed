# @package _global_
# Hierarchical CIFAR-10 / ResNet-18 / FedAvg.
# Inner hop: TorchDist. Outer hop: Flora-style gRPC (until leaders use communicator/grpc).
#
#   ./main.sh --config-name experiment/hierarchical_cifar10_resnet18_fedavg \
#     overwrite=true slurm.account=... slurm.partition=batch

defaults:
  - /base
  - /communicator@topology.local_comm: torchdist
  - /communicator/compression@topology.local_comm.compressor: dense
  - /payload: params
  - override /topology: hierarchical
  - override /algorithm: fedavg
  - override /model: resnet18
  - override /datamodule: cifar10
  - _self_

engine:
  mode: slurm
  hierarchical:
    training:
      dataset_total_clients: 6

topology:
  num_clients: 6
  overrides:
    0:
      datamodule:
        train: null

algorithm:
  local_lr: 0.001
  max_epochs_per_round: 4

model:
  num_classes: 10

datamodule:
  train:
    batch_size: 128
  eval:
    batch_size: 128

global_rounds: 2

slurm:
  enabled: true
  nodes: 7
  ntasks_per_node: 1
