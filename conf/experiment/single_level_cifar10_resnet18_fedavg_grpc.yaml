# @package _global_
# Single-level CIFAR-10 / ResNet-18 / FedAvg / gRPC / dense params.
# Swap groups instead of stacking 3–4 config-names. CLI: slurm.*, data root, nodes.
#
#   ./main.sh --config-name experiment/single_level_cifar10_resnet18_fedavg_grpc \
#     overwrite=true slurm.account=... slurm.partition=batch slurm.nodes=7
#
# Attach/detach examples (CLI or another recipe):
#   algorithm=fedsgd payload=gradients
#   communicator@topology.local_comm=torchdist topology=decentralized slurm.nodes=6
#   communicator/compression@topology.local_comm.compressor=topk
#   algorithm/schedules/aggregation=round_end
#
# Proven PI presets (conf/test_pi_centralized_sync_*) stay unchanged.

defaults:
  - /base
  - /communicator@topology.local_comm: grpc
  - /communicator/compression@topology.local_comm.compressor: dense
  - /payload: params
  - override /topology: centralized
  - override /algorithm: fedavg
  - override /algorithm/schedules/aggregation: batch_end
  - override /model: resnet18
  - override /datamodule: cifar10
  - _self_

engine:
  mode: slurm

topology:
  num_clients: 6
  overrides:
    0:
      datamodule:
        train: null

algorithm:
  local_lr: 0.001
  max_epochs_per_round: 1
  schedules:
    evaluation:
      experiment_start:
        enabled: true
      experiment_end:
        enabled: true
      pre_aggregation:
        enabled: false
      post_aggregation:
        enabled: false

model:
  num_classes: 10

datamodule:
  train:
    batch_size: 128
  eval:
    batch_size: 128

global_rounds: 4

slurm:
  enabled: true
  nodes: 7
  ntasks_per_node: 1
