// Secure (mTLS) variant of ../grpc.proto.
//
// Differences from grpc.proto
//   * Distinct file path, package and service name, so both protos can be loaded
//     in one process without descriptor-pool or RPC-path collisions:
//         grpc.proto         package src.omnifed.communicator              service GrpcServer
//         secure_grpc.proto  package src.omnifed.communicator.secure_grpc  service SecureGrpcServer
//   * No `client_id` on any request. The caller's identity is taken by the server
//     from the verified TLS client certificate (ServicerContext.auth_context()),
//     so there is no message field that could be used to impersonate another rank.
//     Field number 1 is reserved on the former `client_id` messages so nobody
//     re-adds it by accident.
//   * RegisterClient returns the participant id the server derived from the
//     certificate, so the client can verify "the server sees me as rank N".
//   * TensorDict / TensorEntry are copied field-for-field (same names, same numbers)
//     from grpc.proto. The decoders in ../utils.py read these messages by field name
//     and are shared; the encoder is secure_codec.py. If you change TensorEntry in
//     grpc.proto, make the same change here (secure_codec.check_wire_compat() will
//     tell you at start-up if the two have drifted).
//
// Generate (from the repository root, same -I as main.sh uses):
//   python -m grpc_tools.protoc -I. --python_out=. --grpc_python_out=. \
//       ./src/omnifed/communicator/secure_grpc/secure_grpc.proto

syntax = "proto3";

package src.omnifed.communicator.secure_grpc;

// Service definition for the central aggregation server (TLS client certificate required).
service SecureGrpcServer {
    // Get current broadcast state from server
    rpc GetBroadcastState(CallerRequest) returns (OperationResponse);

    // Stream broadcast chunks when the packed model exceeds the unary cap.
    rpc GetBroadcastStateStream(CallerRequest) returns (stream OperationResponse);

    // Submit tensors to server for aggregation
    rpc SubmitForAggregation(AggregationRequest) returns (StatusResponse);

    // One logical aggregate: client streams chunks without waiting for Get.
    rpc SubmitAggregationStream(stream AggregationRequest) returns (StatusResponse);

    // Get aggregated tensor result from server (server long-polls, then returns is_ready=false)
    rpc GetAggregationResult(CallerRequest) returns (OperationResponse);

    // Stream result chunks when the packed result exceeds the unary cap.
    rpc GetAggregationResultStream(CallerRequest) returns (stream OperationResponse);

    // Register client with server; response carries the identity the server derived.
    rpc RegisterClient(CallerRequest) returns (RegisterResponse);
}

// Request that carries nothing: who is calling is decided by the TLS certificate.
message CallerRequest {
    reserved 1;
    reserved "client_id";
}

// Generic tensor submission request
message AggregationRequest {
    reserved 1;
    reserved "client_id";
    TensorDict tensor_dict = 2;
    string reduction_type = 3;  // "SUM", "MEAN" or "MAX" (AggregationOp values)
    int32 num_samples = 4;  // client sample count for sample-weighted grad/param aggregation
    int32 chunk_index = 5;  // 0-based; ignored when n_chunks <= 1
    int32 n_chunks = 6;     // 0 or 1 = single message (backward compatible)
}

// Generic tensor response (used for both broadcast and aggregation results)
message OperationResponse {
    TensorDict tensor_dict = 1;
    bool is_ready = 2;
    int32 chunk_index = 3;
    int32 n_chunks = 4;  // 0 or 1 = single unary payload
}

// Generic status response
message StatusResponse {
    bool success = 1;
}

// Registration result
message RegisterResponse {
    bool success = 1;
    string participant_id = 2;  // identity the server derived from the client certificate (the rank, as a string)
}

// Container for multiple tensor entries
message TensorDict {
    repeated TensorEntry entries = 1;
}

// Single tensor with metadata for exact reconstruction.
// KEEP IN SYNC with TensorEntry in ../grpc.proto (shared decoders read it by field name).
message TensorEntry {
    string key = 1;               // Tensor identifier (e.g., "layer.weight")
    bytes data = 2;               // Serialized tensor data
    repeated int32 shape = 3;     // Tensor dimensions
    string dtype = 4;            // PyTorch dtype (e.g., "torch.float32")
    string device = 5;           // Original tensor device (e.g., "cuda:0", "cpu")
    int32 data_size = 6;         // Byte size for validation
    string compression_type = 7; // The compression algorithm
    bytes index = 8; // The index for compression
    repeated int32 index_shape = 9; // The index shape
    string index_dtype = 10;
    repeated int32 original_shape = 11; // The original data shape
    // QSGD (classic centralized sync grad): norm + quant metadata
    bytes meta_tensor = 12;
    string meta_dtype = 13;
    int32 width = 14;
    int32 level = 15;
}
